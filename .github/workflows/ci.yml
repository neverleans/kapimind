name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-web:
    name: Tests (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx vitest run
      - run: pnpm build

  test-api:
    name: Tests (api)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kapimind
          POSTGRES_PASSWORD: kapimind
          POSTGRES_DB: kapimind
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate --schema=./prisma/schema.prisma
      - run: npx vitest run
      - name: Build
        run: npx nest build
        env:
          DATABASE_URL: postgresql://kapimind:kapimind@localhost:5432/kapimind

  e2e:
    name: E2E smoke (optional)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kapimind
          POSTGRES_PASSWORD: kapimind
          POSTGRES_DB: kapimind
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run dev server + integration tests
        env:
          DATABASE_URL: postgresql://kapimind:kapimind@localhost:5432/kapimind
        run: |
          pnpm dev &
          sleep 15
          npx vitest run src/tests/api-integration.spec.mts
          kill %1 || true
