# =============================================================================
# Kapimind — Docker Compose (desenvolvimento)
#
# PgBouncer adicionado para connection pooling em dev (prepara prod).
# Redis para BullMQ + cache.
# =============================================================================

version: '3.9'

services:
  postgres:
    image: postgres:17-alpine
    container_name: kapimind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kapimind
      POSTGRES_PASSWORD: kapimind
      POSTGRES_DB: kapimind
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kapimind']
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: bitnami/pgbouncer:1.22
    container_name: kapimind-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGBOUNCER_DB_TYPE: postgres
      PGBOUNCER_DB_NAME: kapimind
      PGBOUNCER_DB_USER: kapimind
      PGBOUNCER_DB_PASSWORD: kapimind
      PGBOUNCER_DATABASE_HOST: postgres
      PGBOUNCER_LISTEN_ADDRESS: 0.0.0.0:6432
      PGBOUNCER_AUTH_TYPE: password
      PGBOUNCER_MAX_CLIENT_CONN: 100
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
      PGBOUNCER_MIN_POOL_SIZE: 5
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_SERVER_IDLE_TIMEOUT: 600
    ports:
      - '6432:6432'

  redis:
    image: redis:7-alpine
    container_name: kapimind-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
